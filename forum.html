<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow,noarchive"/>
<meta name="theme-color" content="#0b0c0e"/>
<title>Community Forum — Pixel Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="polish.css"/>
</head>
<body>

<div id="toast" class="toast"></div>

<div id="auth-overlay" class="auth-overlay">
  <div class="auth-modal">
    <div class="auth-logo">
      <div class="auth-logo-dot"></div>
      <span class="font-special">PIXEL NETWORK</span>
    </div>
    <p class="auth-tagline font-special">COMMUNITY FORUM · PREVIEW</p>
    <p class="font-special" style="font-size:11px;line-height:1.7;color:#777;text-align:center;margin:14px 0 18px;max-width:430px">Preview sessions are local and temporary. No account credentials are required or stored.</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">
        <span class="font-special">ENTER</span>
      </button>
      <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">
        <span class="font-special">NEW PROFILE</span>
      </button>
    </div>

    <div id="panel-login" class="auth-panel active">
      <div class="field-group">
        <label class="field-lbl font-special">DISPLAY NAME</label>
        <input type="text" id="login-email" class="field-input font-special" placeholder="Guest" autocomplete="off"/>
      </div>
      <button class="btn-primary font-special" onclick="doLogin()">ENTER FORUM</button>
    </div>

    <div id="panel-signup" class="auth-panel">
      <div class="field-group">
        <label class="field-lbl font-special">DISPLAY NAME</label>
        <input type="text" id="su-username" class="field-input font-special" placeholder="YourName" autocomplete="off"/>
      </div>
      <button class="btn-primary font-special" onclick="doSignup()">CREATE PROFILE</button>
    </div>
  </div>
</div>

<div id="app" class="app" style="display:none">
  <header class="topnav">
    <div class="topnav-inner">
      <a href="index.html" class="topnav-brand">
        <div class="brand-dot"></div>
        <span class="font-special brand-name">PIXEL NETWORK</span>
        <span class="brand-tag font-special">FORUM</span>
      </a>
      <div class="topnav-right">
        <a href="index.html" class="nav-link font-special">← MAIN SITE</a>
        <div class="nav-user" id="nav-user">
          <div class="nav-avatar" id="nav-avatar-border">
            <div class="nav-avatar-inner font-special" id="nav-avatar-char">?</div>
          </div>
          <span class="font-special" id="nav-username">...</span>
        </div>
        <button class="btn-ghost font-special" onclick="doLogout()">EXIT</button>
      </div>
    </div>
  </header>

  <div class="content-wrap">
    <aside class="sidebar">
      <div class="profile-card" id="profile-card">
        <div class="profile-avatar-wrap" id="profile-avatar-wrap">
          <div class="profile-avatar font-special" id="profile-avatar-char">?</div>
        </div>
        <div class="profile-rank-badge font-special" id="profile-rank-badge">MEMBER</div>
        <div class="profile-username font-special" id="profile-username">LOADING...</div>
        <div class="profile-actions">
          <button class="btn-link-mc font-special" id="btn-link-mc" onclick="generateLinkCode()">ACCOUNT LINKING</button>
          <div class="link-code-box" id="link-code-box" style="display:none"></div>
        </div>
      </div>

      <div class="sidebar-nav">
        <div class="sidebar-nav-item active font-special">ALL POSTS</div>
      </div>
    </aside>

    <main class="forum-main">
      <div class="create-post-box" id="create-post-box">
        <div class="create-post-header"><span class="font-special">NEW POST</span></div>
        <input type="text" id="post-title" class="create-input font-special" placeholder="Post title" autocomplete="off"/>
        <textarea id="post-body" class="create-textarea font-special" placeholder="Write something for the community..."></textarea>
        <div class="create-footer">
          <span class="cooldown-info font-special" id="cooldown-info"></span>
          <button class="btn-submit font-special" id="btn-submit" onclick="submitPost()">PUBLISH</button>
        </div>
      </div>

      <div class="posts-header">
        <span class="posts-count font-special" id="posts-count">LOADING...</span>
        <button class="btn-refresh font-special" onclick="loadPosts()">REFRESH</button>
      </div>

      <div id="posts-feed" class="posts-feed">
        <div class="loading-posts">
          <div class="loading-spinner"></div>
          <span class="font-special">LOADING POSTS...</span>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="app.js"></script>
<script src="polish.js"></script>
</body>
</html>
