name: PixelWeb Quality Gate

on:
  push:
    branches: ["hardening/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch, tag, or commit SHA to validate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pixelweb-quality-${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}
  cancel-in-progress: true

jobs:
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}
          persist-credentials: false

      - name: Validate Python guard syntax
        run: python3 -m py_compile scripts/security_scan.py scripts/validate_site.py scripts/validate_accessibility.py scripts/validate_media_integrity.py scripts/validate_runtime_contracts.py scripts/build_public_site.py scripts/validate_public_bundle.py

      - name: Scan committed files for obvious secrets
        run: python3 scripts/security_scan.py

      - name: Validate approved media integrity
        run: python3 scripts/validate_media_integrity.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Validate canonical public data consistency
        run: node scripts/validate_public_data.js

      - name: Validate static site integrity, CSP and transport policy
        run: python3 scripts/validate_site.py

      - name: Validate deferred media and runtime contracts
        run: python3 scripts/validate_runtime_contracts.py

      - name: Validate accessibility structure
        run: python3 scripts/validate_accessibility.py

      - name: Build allowlisted public site artifact
        run: python3 scripts/build_public_site.py

      - name: Validate public artifact boundary
        run: python3 scripts/validate_public_bundle.py
